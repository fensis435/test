apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
data:
  grafana.ini: |
    [server]
    root_url = https://grafana.yourdomain.com
    
    [auth]
    disable_login_form = true
    disable_signout_menu = false
    
    [auth.proxy]
    enabled = true
    header_name = X-Auth-Request-User
    header_property = username
    auto_sign_up = true
    
    # ユーザーをメールアドレスで同期
    sync_ttl = 60
    
    # ヘッダーからホワイトスペースを削除
    whitelist =
    
    # 追加のヘッダー情報
    headers = Email:X-Auth-Request-Email Groups:X-Auth-Request-Groups
    
    # 管理者権限の自動付与
    enable_login_token = false
    
    [users]
    # 自動サインアップの許可
    allow_sign_up = true
    auto_assign_org = true
    auto_assign_org_id = 1
    
    # デフォルトロール（プロキシから上書き可能）
    auto_assign_org_role = Viewer
    
    [auth.basic]
    enabled = false
    
    [auth.anonymous]
    enabled = false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_AUTH_PROXY_ENABLED
          value: "true"
        - name: GF_AUTH_PROXY_HEADER_NAME
          value: "X-Auth-Request-User"
        - name: GF_AUTH_PROXY_HEADER_PROPERTY
          value: "username"
        - name: GF_AUTH_PROXY_AUTO_SIGN_UP
          value: "true"
        - name: GF_AUTH_PROXY_HEADERS
          value: "Email:X-Auth-Request-Email Groups:X-Auth-Request-Groups"
        - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
          value: "Viewer"
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: "true"
        volumeMounts:
        - name: grafana-config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        - name: grafana-storage
          mountPath: /var/lib/grafana
      volumes:
      - name: grafana-config
        configMap:
          name: grafana-config
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: grafana
