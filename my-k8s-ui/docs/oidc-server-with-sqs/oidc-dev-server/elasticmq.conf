include classpath("application.conf")

// ----------------------------------------------------------------------------
// ElasticMQ(SQS互換API)の設定。
// AWS SDKからは実SQSと全く同じインターフェースで扱えるため、
// 「オンプレとAWSのコードを同じにしたい」という要件を、
// エンドポイントURLの向き先を変えるだけで満たせる。
// ----------------------------------------------------------------------------

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

// 起動時に自動作成されるキュー。
// oidc-dev-server(送信側)・Railsのポーラー(受信側)双方が
// このキュー名を前提にしている(SQS_QUEUE_URL / ENV["SQS_QUEUE_URL"])。
queues {
  cognito-user-events {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 10 seconds
  }
}
