# ----------------------------------------------------------------------------
# SQLiteはファイルロックの都合上、複数Pod間での共有書き込みに対応しない。
# そのため本Deploymentは replicas: 1 (StatefulSet相当の単一レプリカ運用)を
# 前提とする。このPVCはRWO(ReadWriteOnce)アクセスモードで十分。
# ----------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oidc-dev-server-data
  namespace: default
  labels:
    app: oidc-dev-server
    app.kubernetes.io/name: oidc-dev-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oidc-dev-server-jwks
  namespace: default
  labels:
    app: oidc-dev-server
    app.kubernetes.io/name: oidc-dev-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
