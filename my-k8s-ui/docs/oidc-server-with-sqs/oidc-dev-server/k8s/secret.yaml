# ----------------------------------------------------------------------------
# 本テンプレートには実値を記載しない。
# 実運用ではExternal Secrets Operator等の外部Secret管理と連携し、
# kubectl apply -f にプレーンな値を含めないこと。
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: oidc-dev-server-secret
  namespace: default
  labels:
    app: oidc-dev-server
    app.kubernetes.io/name: oidc-dev-server
type: Opaque
stringData:
  OIDC_COOKIE_KEYS: "REPLACE_ME_WITH_GENERATED_SECRET"
  ADMIN_JWT_SECRET: "REPLACE_ME_WITH_GENERATED_SECRET"
