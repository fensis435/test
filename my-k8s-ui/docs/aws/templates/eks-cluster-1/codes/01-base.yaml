AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Base: VPC(2AZ), KMS x5, Cognito UserPool(label-only groups),
  Route53 ACM wildcard cert.

Parameters:
  ProjectName:
    Type: String
    Default: eks-project
  Environment:
    Type: String
    AllowedValues: [dev, stg, prod]
    Default: prod
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  DomainName:
    Type: String
  HostedZoneId:
    Type: String

Resources:

  # ============================================================
  # KMS Keys
  # ============================================================
  EKSSecretsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: EKS Secrets encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Root
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: EKS
            Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-eks-secrets-key
  EKSSecretsKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName:   !Sub alias/${ProjectName}-${Environment}-eks-secrets
      TargetKeyId: !Ref EKSSecretsKMSKey

  RDSKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: RDS Aurora encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Root
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: RDS
            Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-rds-key
  RDSKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName:   !Sub alias/${ProjectName}-${Environment}-rds
      TargetKeyId: !Ref RDSKMSKey

  EBSKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: EBS encryption (system managed node group)
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Root
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: EC2
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey, kms:CreateGrant]
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-ebs-key
  EBSKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName:   !Sub alias/${ProjectName}-${Environment}-ebs
      TargetKeyId: !Ref EBSKMSKey

  EFSKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: EFS encryption (Rails EFS PVs)
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Root
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: EFS
            Effect: Allow
            Principal:
              Service: elasticfilesystem.amazonaws.com
            Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-efs-key
  EFSKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName:   !Sub alias/${ProjectName}-${Environment}-efs
      TargetKeyId: !Ref EFSKMSKey

  # Secrets Manager dedicated key (separate from EKS Secrets key)
  SecretsManagerKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Secrets Manager secrets encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Root
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: SecretsManager
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey, kms:CreateGrant]
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-sm-key
  SecretsManagerKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName:   !Sub alias/${ProjectName}-${Environment}-sm
      TargetKeyId: !Ref SecretsManagerKMSKey

  # ============================================================
  # VPC — 2 AZ (index 0,1)
  #   Public  10.0.0.0/24  10.0.1.0/24   (ALB)
  #   Private 10.0.10.0/24 10.0.11.0/24  (EKS nodes)
  #   DB      10.0.20.0/24 10.0.21.0/24  (RDS, isolated)
  # ============================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-vpc

  IGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-igw
  IGWAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  # Public
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-public-1
        - Key: kubernetes.io/role/elb
          Value: '1'
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-public-2
        - Key: kubernetes.io/role/elb
          Value: '1'

  # Private
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-private-1
        - Key: kubernetes.io/role/internal-elb
          Value: '1'
        - Key: !Sub kubernetes.io/cluster/${ProjectName}-${Environment}
          Value: owned
        - Key: karpenter.sh/discovery
          Value: !Sub ${ProjectName}-${Environment}
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-private-2
        - Key: kubernetes.io/role/internal-elb
          Value: '1'
        - Key: !Sub kubernetes.io/cluster/${ProjectName}-${Environment}
          Value: owned
        - Key: karpenter.sh/discovery
          Value: !Sub ${ProjectName}-${Environment}

  # DB
  DBSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.20.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-db-1
  DBSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.21.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-db-2

  # NAT (1 per AZ)
  NatEIP1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  NatEIP2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  NatGW1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-nat-1
  NatGW2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-nat-2

  # Route tables
  PublicRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-public-rt
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttach
    Properties:
      RouteTableId: !Ref PublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW
  PubSub1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRT
  PubSub2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRT

  PrivateRT1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-private-rt-1
  PrivateRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRT1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGW1
  PriSub1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRT1

  PrivateRT2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-private-rt-2
  PrivateRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRT2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGW2
  PriSub2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRT2

  DBRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-db-rt
  DBSub1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DBSubnet1
      RouteTableId: !Ref DBRT
  DBSub2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DBSubnet2
      RouteTableId: !Ref DBRT

  # ============================================================
  # Cognito (label-only groups — no IAM linkage)
  # ============================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${ProjectName}-${Environment}-user-pool
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      PasswordPolicy:
        MinimumLength: 12
        RequireUppercase: true
        RequireLowercase: true
        RequireNumbers: true
        RequireSymbols: true
        TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: role
          AttributeDataType: String
          Required: false
          Mutable: true
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: !Ref Environment

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${ProjectName}-${Environment}-client
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      CallbackURLs:
        - !Sub https://${DomainName}/auth/callback
      LogoutURLs:
        - !Sub https://${DomainName}/auth/logout
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [email, openid, profile]
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders: [COGNITO]

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${ProjectName}-${Environment}-auth
      UserPoolId: !Ref CognitoUserPool

  # Cognito Groups — labels only (RoleArn omitted intentionally)
  CognitoGroupAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Platform administrators (label only — RBAC in Rails)
      UserPoolId: !Ref CognitoUserPool
      Precedence: 10
  CognitoGroupDeveloper:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: developer
      Description: Project developers (label only)
      UserPoolId: !Ref CognitoUserPool
      Precedence: 20
  CognitoGroupViewer:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: viewer
      Description: Read-only viewers (label only)
      UserPoolId: !Ref CognitoUserPool
      Precedence: 30

  # ============================================================
  # ACM Certificate (wildcard, DNS validated)
  # ============================================================
  ACMCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub '*.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-cert

Outputs:
  VpcId:
    Value: !Ref VPC
    Export:
      Name: !Sub ${ProjectName}-${Environment}-VpcId
  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub ${ProjectName}-${Environment}-PublicSubnet1Id
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub ${ProjectName}-${Environment}-PublicSubnet2Id
  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub ${ProjectName}-${Environment}-PrivateSubnet1Id
  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub ${ProjectName}-${Environment}-PrivateSubnet2Id
  DBSubnet1Id:
    Value: !Ref DBSubnet1
    Export:
      Name: !Sub ${ProjectName}-${Environment}-DBSubnet1Id
  DBSubnet2Id:
    Value: !Ref DBSubnet2
    Export:
      Name: !Sub ${ProjectName}-${Environment}-DBSubnet2Id
  PrivateRouteTable1Id:
    Value: !Ref PrivateRT1
    Export:
      Name: !Sub ${ProjectName}-${Environment}-PrivateRouteTable1Id
  PrivateRouteTable2Id:
    Value: !Ref PrivateRT2
    Export:
      Name: !Sub ${ProjectName}-${Environment}-PrivateRouteTable2Id
  DBRouteTableId:
    Value: !Ref DBRT
    Export:
      Name: !Sub ${ProjectName}-${Environment}-DBRouteTableId
  NatGateway1Id:
    Value: !Ref NatGW1
    Export:
      Name: !Sub ${ProjectName}-${Environment}-NatGateway1Id
  NatGateway2Id:
    Value: !Ref NatGW2
    Export:
      Name: !Sub ${ProjectName}-${Environment}-NatGateway2Id
  EKSSecretsKMSKeyArn:
    Value: !GetAtt EKSSecretsKMSKey.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EKSSecretsKMSKeyArn
  RDSKMSKeyArn:
    Value: !GetAtt RDSKMSKey.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-RDSKMSKeyArn
  EBSKMSKeyArn:
    Value: !GetAtt EBSKMSKey.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EBSKMSKeyArn
  EFSKMSKeyArn:
    Value: !GetAtt EFSKMSKey.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EFSKMSKeyArn
  SecretsManagerKMSKeyArn:
    Value: !GetAtt SecretsManagerKMSKey.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-SecretsManagerKMSKeyArn
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CognitoUserPoolId
  CognitoUserPoolArn:
    Value: !GetAtt CognitoUserPool.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CognitoUserPoolArn
  CognitoUserPoolClientId:
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CognitoUserPoolClientId
  ACMCertificateArn:
    Value: !Ref ACMCertificate
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ACMCertificateArn
  HostedZoneId:
    Value: !Ref HostedZoneId
    Export:
      Name: !Sub ${ProjectName}-${Environment}-HostedZoneId
  DomainName:
    Value: !Ref DomainName
    Export:
      Name: !Sub ${ProjectName}-${Environment}-DomainName
