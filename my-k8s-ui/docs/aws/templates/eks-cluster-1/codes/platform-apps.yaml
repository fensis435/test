# =============================================================================
# argocd/platform-apps.yaml  v5
# Platform管理系 ArgoCD Application群
# 全て system MNG (CriticalAddonsOnly=true:NoSchedule) で動作
#
# 追加: NGINX Ingress Controller
#   役割: ALB Target → URLパス書換 → my-gui テナントへ reverse proxy
#   Browser → ALB → NGINX(/gui-<uuid>/... → /...) → my-gui pod
# =============================================================================

# ── cert-manager ──────────────────────────────────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.16.2
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
        webhook:
          replicaCount: 1
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        cainjector:
          replicaCount: 1
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        nodeSelector:
          role: system
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]

# ── ClusterIssuers ────────────────────────────────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-issuers
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ARGOCD_REPO_URL_PLACEHOLDER
    targetRevision: HEAD
    path: platform/cluster-issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]

# ── External Secrets Operator ─────────────────────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.4
    helm:
      values: |
        replicaCount: 1
        installCRDs: true
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
        webhook:
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        certController:
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        nodeSelector:
          role: system
        serviceAccount:
          name: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]

# ── ClusterSecretStore (ESO → Secrets Manager) ────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: ARGOCD_REPO_URL_PLACEHOLDER
    targetRevision: HEAD
    path: platform/secret-stores
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: {prune: true, selfHeal: true}

# ── NGINX Ingress Controller ──────────────────────────────────────────────────
# 役割: ALB(internet-facing)のターゲット
#       URLパス /gui-<uuid>/... → /<path> に書き換えて my-gui へ reverse proxy
# my-gui内のenvoyが更にmy-appへのURL書き換えを担当
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.11.3
    helm:
      values: |
        controller:
          # system MNG上で動作
          nodeSelector:
            role: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
          replicaCount: 1

          # ALB Target Groupとして動作 (ALBがNGINXにL7トラフィックを転送)
          # ALBはAWSのNLBではなくALB → target-type: ip
          service:
            type: NodePort    # ALBのTargetGroupがNodePortを向く
            nodePorts:
              http: 30080
              https: 30443

          # NGINX設定: URLパス書き換え
          # /gui-<uuid>/path → /path に書き換えてmy-guiへ転送
          config:
            use-proxy-protocol: "false"
            proxy-real-ip-cidr: "0.0.0.0/0"
            # X-Forwarded-* ヘッダーを保持 (my-guiがユーザ情報取得に使用)
            compute-full-forwarded-for: "true"
            use-forwarded-headers: "true"
            # WebSocket対応 (my-guiがリアルタイム通信する場合)
            proxy-read-timeout: "3600"
            proxy-send-timeout: "3600"

          # ALBヘルスチェック用エンドポイント
          healthCheckPath: /healthz

          metrics:
            enabled: true
            serviceMonitor:
              enabled: false

          # ALBからの転送を受け付けるポート
          containerPort:
            http: 80
            https: 443

          # IngressClass: nginx (my-guiテナントのIngressリソースがこれを使用)
          ingressClassResource:
            name: nginx
            enabled: true
            default: false   # ALB用ingressはalb classを使う

          # Podレベルのセキュリティ
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 101
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]

        # RBAC
        rbac:
          create: true

        # ServiceAccount
        serviceAccount:
          create: true
          name: ingress-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
