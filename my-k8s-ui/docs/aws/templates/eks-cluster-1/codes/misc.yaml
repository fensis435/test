{{/* ==========================================================================
  rails-gui/templates/misc.yaml
  EFS PVC / cert-manager Certificate / Leader Election RBAC /
  ArgoCD Application CRD / ArgoCD同期待機Job / Service / HPA / PDB /
  NetworkPolicy / ExternalSecret
  ========================================================================== */}}

# ── EFS PVC (ReadWriteMany — 2AZ安全) ────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rails-gui.fullname" . }}-efs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rails-gui.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteMany   # EFSのみ使用 (EBSはAZ固定でMulti-AZに不適)
  storageClassName: efs-sc
  resources:
    requests:
      storage: {{ .Values.persistence.size }}

# ── cert-manager Certificate (SSH host key — rsync sidecar用) ─────────────────
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "rails-gui.fullname" . }}-ssh-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rails-gui.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: {{ include "rails-gui.fullname" . }}-ssh-cert
  issuerRef:
    name: internal-ca-issuer   # cert-managerが管理するClusterIssuer
    kind: ClusterIssuer
  commonName: {{ include "rails-gui.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  dnsNames:
    - {{ include "rails-gui.fullname" . }}
    - {{ include "rails-gui.fullname" . }}.{{ .Release.Namespace }}
    - {{ include "rails-gui.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

# ── ServiceAccount ────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rails-gui.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rails-gui.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: true   # Pod Identity に必要

# ── Leader Election RBAC ──────────────────────────────────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rails-gui.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["rails-gui-leader"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rails-gui.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rails-gui.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "rails-gui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

# ── ArgoCD Application (upgrade自動、install/uninstallはRails Job経由) ──────────
# Rails Job が ArgoCD API で sync/delete → 完了を周期ポーリングで待機
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "rails-gui.fullname" . }}
  namespace: argocd
  labels:
    {{- include "rails-gui.labels" . | nindent 4 }}
    app.kubernetes.io/managed-by-rails: "gui"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: rails-workloads
  source:
    repoURL: {{ .Values.argocd.helmRepoUrl }}
    chart: rails-gui
    targetRevision: {{ .Values.argocd.chartVersion | default "*" }}
    helm:
      parameters:
        - name: image.tag
          value: {{ .Values.image.tag | quote }}
        - name: namespace
          value: {{ .Release.Namespace | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  syncPolicy:
    # upgrade: ArgoCD が自動検出・自動sync (CodeBuildがHelm repo更新時)
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # Rails Job pre-hookが作成済み
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas   # HPA管理

# ── ArgoCD同期待機Job ──────────────────────────────────────────────────────────
# Rails の helm install/uninstall Jobから呼び出される。
# install: ArgoCD Applicationを作成してsyncをトリガー → 完了まで周期ポーリング
# uninstall: ArgoCD Applicationをdeleteして削除完了まで周期ポーリング
# このJobがRailsの既存pre/post処理フローに組み込まれ、同期完了後にpostを実行。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rails-gui.fullname" . }}-argocd-scripts
  namespace: {{ .Release.Namespace }}
data:
  wait-for-sync.sh: |
    #!/bin/bash
    # ==========================================================================
    # ArgoCD sync 完了待機スクリプト
    # Rails Job から呼び出される。ARGOCD_APP_NAME / ACTION (install|uninstall) を受け取る。
    # ArgoCDのREST APIをポーリングしてsync/delete完了を確認する。
    # ==========================================================================
    set -euo pipefail

    ARGOCD_SERVER="${ARGOCD_SERVER:-argocd-server.argocd.svc.cluster.local:443}"
    ARGOCD_APP="${ARGOCD_APP_NAME}"
    ACTION="${ACTION:-install}"        # install または uninstall
    POLL_INTERVAL="${POLL_INTERVAL:-5}" # 秒
    TIMEOUT="${TIMEOUT:-300}"           # タイムアウト秒

    # ArgoCDトークン取得 (Secrets Manager経由 — RailsPodRoleが許可)
    TOKEN=$(aws secretsmanager get-secret-value \
      --secret-id "${ARGOCD_TOKEN_SECRET_ARN}" \
      --query SecretString --output text | jq -r '.token')

    argocd_api() {
      curl -sk -H "Authorization: Bearer ${TOKEN}" \
        "https://${ARGOCD_SERVER}/api/v1/$1"
    }

    argocd_api_post() {
      curl -sk -X POST -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "$2" \
        "https://${ARGOCD_SERVER}/api/v1/$1"
    }

    elapsed=0

    if [[ "${ACTION}" == "install" ]]; then
      echo "[ArgoCD] Triggering sync for app: ${ARGOCD_APP}"

      # sync をトリガー
      argocd_api_post "applications/${ARGOCD_APP}/sync" \
        '{"prune":true,"dryRun":false,"strategy":{"hook":{"force":true}}}'

      # Synced + Healthy になるまでポーリング
      while [[ $elapsed -lt $TIMEOUT ]]; do
        response=$(argocd_api "applications/${ARGOCD_APP}" 2>/dev/null || echo "{}")
        sync_status=$(echo "$response"   | jq -r '.status.sync.status   // "Unknown"')
        health_status=$(echo "$response" | jq -r '.status.health.status // "Unknown"')
        op_phase=$(echo "$response"      | jq -r '.status.operationState.phase // "Unknown"')

        echo "[ArgoCD] ${elapsed}s — sync=${sync_status}, health=${health_status}, op=${op_phase}"

        if [[ "${sync_status}" == "Synced" && "${health_status}" == "Healthy" ]]; then
          echo "[ArgoCD] ✓ Application ${ARGOCD_APP} is Synced and Healthy"
          exit 0
        fi

        # エラー検出
        if [[ "${op_phase}" == "Failed" || "${op_phase}" == "Error" ]]; then
          error_msg=$(echo "$response" | jq -r '.status.operationState.message // "unknown error"')
          echo "[ArgoCD] ✗ Sync failed: ${error_msg}"
          exit 1
        fi

        sleep "${POLL_INTERVAL}"
        elapsed=$((elapsed + POLL_INTERVAL))
      done

      echo "[ArgoCD] ✗ Timeout after ${TIMEOUT}s waiting for sync"
      exit 1

    elif [[ "${ACTION}" == "uninstall" ]]; then
      echo "[ArgoCD] Deleting app: ${ARGOCD_APP}"

      # cascade delete (関連リソースも削除)
      argocd_api_post "applications/${ARGOCD_APP}?cascade=true&propagationPolicy=foreground" "" \
        2>/dev/null || true

      # Application が消えるまでポーリング
      while [[ $elapsed -lt $TIMEOUT ]]; do
        status_code=$(curl -sk -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer ${TOKEN}" \
          "https://${ARGOCD_SERVER}/api/v1/applications/${ARGOCD_APP}")

        echo "[ArgoCD] ${elapsed}s — HTTP ${status_code}"

        if [[ "${status_code}" == "404" ]]; then
          echo "[ArgoCD] ✓ Application ${ARGOCD_APP} deleted successfully"
          exit 0
        fi

        sleep "${POLL_INTERVAL}"
        elapsed=$((elapsed + POLL_INTERVAL))
      done

      echo "[ArgoCD] ✗ Timeout after ${TIMEOUT}s waiting for delete"
      exit 1
    fi

# ── Service ───────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rails-gui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rails-gui.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rails-gui.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: ssh
      port: 2222
      targetPort: 2222

# ── HPA ───────────────────────────────────────────────────────────────────────
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rails-gui.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rails-gui.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300

# ── PDB ───────────────────────────────────────────────────────────────────────
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rails-gui.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "rails-gui.selectorLabels" . | nindent 6 }}

# ── NetworkPolicy ─────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rails-gui.fullname" . }}-netpol
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "rails-gui.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aws-load-balancer
      ports:
        - port: 3000
    - from:
        - podSelector: {}
      ports:
        - port: 2222
        - port: 3000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 2049
    - ports:
        - protocol: TCP
          port: 2222

# ── ExternalSecret (DB credentials from Secrets Manager) ──────────────────────
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DB_HOST:     "{{ `{{ .host }}` }}"
        DB_PORT:     "{{ `{{ .port }}` }}"
        DB_NAME:     "{{ `{{ .dbname }}` }}"
        DB_USERNAME: "{{ `{{ .username }}` }}"
        DB_PASSWORD: "{{ `{{ .password }}` }}"
        DATABASE_URL: "postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ `{{ .host }}` }}:{{ `{{ .port }}` }}/{{ `{{ .dbname }}` }}?sslmode=require"
  data:
    - secretKey: host
      remoteRef:
        key: "{{ .Values.secretsManager.rdsSecretName }}"
        property: host
    - secretKey: port
      remoteRef:
        key: "{{ .Values.secretsManager.rdsSecretName }}"
        property: port
    - secretKey: dbname
      remoteRef:
        key: "{{ .Values.secretsManager.rdsSecretName }}"
        property: dbname
    - secretKey: username
      remoteRef:
        key: "{{ .Values.secretsManager.rdsSecretName }}"
        property: username
    - secretKey: password
      remoteRef:
        key: "{{ .Values.secretsManager.rdsSecretName }}"
        property: password
