AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM Roles (Pod Identity):
  EKSCluster, EKSNode(system MNG + Karpenter nodes),
  Karpenter, EBS-CSI, EFS-CSI, ALB-Controller,
  ESO(ExternalSecrets), ArgoCD, ContainerInsights(CloudWatch Agent + Fluent-bit),
  Rails(SQS/Cognito/SM/ECR), ArgoCDBridge, CodeBuild, VPCFlowLogs, CloudTrail.

Parameters:
  ProjectName:
    Type: String
    Default: eks-project
  Environment:
    Type: String
    Default: prod

Resources:

  # ============================================================
  # EKS Cluster Role
  # ============================================================
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-eks-cluster-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSVPCResourceController
      Policies:
        - PolicyName: EKSKMSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey, kms:ListGrants]
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-EKSSecretsKMSKeyArn

  # ============================================================
  # EKS Node Role
  # Shared by: system MNG nodes + Karpenter-provisioned nodes
  # ============================================================
  EKSNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-eks-node-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: NodeEBSKMSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey, kms:CreateGrant]
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-EBSKMSKeyArn

  EKSNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${ProjectName}-${Environment}-eks-node-profile
      Roles:
        - !Ref EKSNodeRole

  # ============================================================
  # Karpenter Controller Role (Pod Identity)
  # ============================================================
  KarpenterControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-karpenter-controller-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: KarpenterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateLaunchTemplate
                  - ec2:CreateFleet
                  - ec2:RunInstances
                  - ec2:CreateTags
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeInstances
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeImages
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeInstanceTypeOfferings
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeSpotPriceHistory
                Resource: '*'
              - Effect: Allow
                Action: [ec2:TerminateInstances, ec2:DeleteLaunchTemplate]
                Resource: '*'
                Condition:
                  StringLike:
                    ec2:ResourceTag/karpenter.sh/nodepool: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt EKSNodeRole.Arn
              - Effect: Allow
                Action: [eks:DescribeCluster]
                Resource: '*'
              - Effect: Allow
                Action: pricing:GetProducts
                Resource: '*'
              - Effect: Allow
                Action: [sqs:DeleteMessage, sqs:GetQueueUrl, sqs:GetQueueAttributes, sqs:ReceiveMessage]
                Resource: !GetAtt KarpenterInterruptionQueue.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}::parameter/aws/service/eks/optimized-ami/*

  # Karpenter SQS + EventBridge (spot interruption handling)
  KarpenterInterruptionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${Environment}-karpenter-interruption
      MessageRetentionPeriod: 300
      KmsMasterKeyId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-EKSSecretsKMSKeyArn

  KarpenterInterruptionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref KarpenterInterruptionQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [events.amazonaws.com, sqs.amazonaws.com]
            Action: sqs:SendMessage
            Resource: !GetAtt KarpenterInterruptionQueue.Arn

  SpotInterruptionRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-spot-interruption
      EventPattern:
        source: [aws.ec2]
        detail-type: [EC2 Spot Instance Interruption Warning]
      Targets:
        - Arn: !GetAtt KarpenterInterruptionQueue.Arn
          Id: KarpenterQueue

  InstanceStateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-instance-state-change
      EventPattern:
        source: [aws.ec2]
        detail-type: [EC2 Instance State-change Notification]
      Targets:
        - Arn: !GetAtt KarpenterInterruptionQueue.Arn
          Id: KarpenterQueue

  RebalanceRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-rebalance
      EventPattern:
        source: [aws.ec2]
        detail-type: [EC2 Instance Rebalance Recommendation]
      Targets:
        - Arn: !GetAtt KarpenterInterruptionQueue.Arn
          Id: KarpenterQueue

  # ============================================================
  # EBS CSI Driver Role (Pod Identity)
  # ============================================================
  EBSCSIDriverRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-ebs-csi-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action: [sts:AssumeRole, sts:TagSession]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
      Policies:
        - PolicyName: EBSKMSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [kms:CreateGrant, kms:ListGrants, kms:RevokeGrant, kms:Encrypt,
                         kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-EBSKMSKeyArn

  # ============================================================
  # EFS CSI Driver Role (Pod Identity)
  # ============================================================
  EFSCSIDriverRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-efs-csi-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action: [sts:AssumeRole, sts:TagSession]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEFSCSIDriverPolicy
      Policies:
        - PolicyName: EFSKMSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-EFSKMSKeyArn

  # ============================================================
  # ALB Controller Role (Pod Identity)
  # ============================================================
  ALBControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-alb-controller-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: ALBControllerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName: elasticloadbalancing.amazonaws.com
              - Effect: Allow
                Action:
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeAddresses
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeInstances
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeTags
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeListenerCertificates
                  - elasticloadbalancing:DescribeSSLPolicies
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetGroupAttributes
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeTags
                  - acm:ListCertificates
                  - acm:DescribeCertificate
                  - wafv2:GetWebACL
                  - wafv2:GetWebACLForResource
                  - wafv2:AssociateWebACL
                  - wafv2:DisassociateWebACL
                  - cognito-idp:DescribeUserPoolClient
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:CreateSecurityGroup
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:DeleteSecurityGroup
                Resource: '*'
              - Effect: Allow
                Action:
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:CreateRule
                  - elasticloadbalancing:DeleteRule
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:RemoveTags
                  - elasticloadbalancing:ModifyLoadBalancerAttributes
                  - elasticloadbalancing:SetSecurityGroups
                  - elasticloadbalancing:SetSubnets
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:ModifyTargetGroup
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:DeregisterTargets
                  - elasticloadbalancing:SetWebAcl
                  - elasticloadbalancing:ModifyListener
                  - elasticloadbalancing:AddListenerCertificates
                  - elasticloadbalancing:RemoveListenerCertificates
                  - elasticloadbalancing:ModifyRule
                Resource: '*'

  # ============================================================
  # ESO (External Secrets Operator) Role (Pod Identity)
  # Needed to call secretsmanager:GetSecretValue via ClusterSecretStore
  # ============================================================
  ESOControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-eso-controller-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: ESOSecretsManagerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:ListSecretVersionIds
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/*
              - Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey, kms:GenerateDataKey]
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-SecretsManagerKMSKeyArn

  # ============================================================
  # ArgoCD Role (Pod Identity) — argocd-server SA
  # ============================================================
  ArgoCDRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-argocd-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: ArgoCDSecretsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/argocd/*
              - Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey]
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-SecretsManagerKMSKeyArn

  # ============================================================
  # CloudWatch Agent Role (Pod Identity) — cloudwatch-agent SA
  # ============================================================
  CloudWatchAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-cw-agent-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action: [sts:AssumeRole, sts:TagSession]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: CWAgentKMSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-EKSSecretsKMSKeyArn

  # ============================================================
  # Fluent Bit Role (Pod Identity) — fluent-bit SA
  # (separate from CW Agent — different SA, same namespace)
  # ============================================================
  FluentBitRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-fluent-bit-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: FluentBitPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:DescribeLogGroups
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/containerinsights/*
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-EKSSecretsKMSKeyArn

  # ============================================================
  # Rails Pod Role (Pod Identity)
  # Used by: rails-gui-sa, rails-app-sa in gui-*/app-* namespaces
  # Permissions: SQS(Cognito events) + Cognito read + SM + ECR + CW logs
  # ============================================================
  RailsPodRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-rails-pod-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: RailsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # SQS: Cognito user event queue (long polling)
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-CognitoEventQueueArn
              # Cognito: read user/group info after event
              - Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:ListUsers
                  - cognito-idp:ListUsersInGroup
                  - cognito-idp:GetGroup
                  - cognito-idp:ListGroups
                  - cognito-idp:DescribeUserPool
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-CognitoUserPoolArn
              # Secrets Manager: DB credentials, app secrets
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/*
              # KMS: decrypt SM secrets + SQS messages
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource:
                  - !ImportValue
                    Fn::Sub: ${ProjectName}-${Environment}-SecretsManagerKMSKeyArn
                  - !ImportValue
                    Fn::Sub: ${ProjectName}-${Environment}-EKSSecretsKMSKeyArn
              # ECR: pull images
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/*
              # CloudWatch Logs
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogGroups, logs:DescribeLogStreams]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/eks/${ProjectName}-${Environment}/*

  # ============================================================
  # ArgoCD Bridge Role (Pod Identity)
  # Used by Rails Jobs to call ArgoCD REST API for install/uninstall.
  # Only needs access to the ArgoCD deployer token in Secrets Manager.
  # ============================================================
  ArgoCDBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-argocd-bridge-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: ArgoCDBridgePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/argocd/*
              - Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey]
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-SecretsManagerKMSKeyArn

  # ============================================================
  # CodeBuild Role (used by CodeBuild service, not Pod Identity)
  # ============================================================
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-codebuild-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/*
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-${Environment}*
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/github/*
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-EKSSecretsKMSKeyArn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:GetObjectVersion, s3:ListBucket]
                Resource: !Sub arn:aws:s3:::${ProjectName}-${Environment}-codebuild-cache-${AWS::AccountId}/*
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !Sub arn:aws:s3:::${ProjectName}-${Environment}-codebuild-cache-${AWS::AccountId}
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: '*'
              # VPC access
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:CreateNetworkInterfacePermission
                Resource: '*'

  # VPC Flow Logs Role (not Pod Identity — used by VPC Flow Logs service)
  VPCFlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-vpc-flowlog-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VPCFlowLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents,
                         logs:DescribeLogGroups, logs:DescribeLogStreams]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vpc/flowlogs/${ProjectName}-${Environment}*

  # CloudTrail CW Logs Role (not Pod Identity)
  CloudTrailCWLogsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-cloudtrail-cwlogs-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailCWLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/cloudtrail/${ProjectName}-${Environment}/*

  # RDS Enhanced Monitoring Role (not Pod Identity)
  RDSMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-rds-monitoring-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

Outputs:
  EKSClusterRoleArn:
    Value: !GetAtt EKSClusterRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EKSClusterRoleArn
  EKSNodeRoleArn:
    Value: !GetAtt EKSNodeRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EKSNodeRoleArn
  EKSNodeInstanceProfileArn:
    Value: !GetAtt EKSNodeInstanceProfile.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EKSNodeInstanceProfileArn
  KarpenterControllerRoleArn:
    Value: !GetAtt KarpenterControllerRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-KarpenterControllerRoleArn
  KarpenterInterruptionQueueName:
    Value: !GetAtt KarpenterInterruptionQueue.QueueName
    Export:
      Name: !Sub ${ProjectName}-${Environment}-KarpenterInterruptionQueueName
  EBSCSIDriverRoleArn:
    Value: !GetAtt EBSCSIDriverRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EBSCSIDriverRoleArn
  EFSCSIDriverRoleArn:
    Value: !GetAtt EFSCSIDriverRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EFSCSIDriverRoleArn
  ALBControllerRoleArn:
    Value: !GetAtt ALBControllerRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ALBControllerRoleArn
  ESOControllerRoleArn:
    Value: !GetAtt ESOControllerRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ESOControllerRoleArn
  ArgoCDRoleArn:
    Value: !GetAtt ArgoCDRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ArgoCDRoleArn
  CloudWatchAgentRoleArn:
    Value: !GetAtt CloudWatchAgentRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CloudWatchAgentRoleArn
  FluentBitRoleArn:
    Value: !GetAtt FluentBitRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-FluentBitRoleArn
  RailsPodRoleArn:
    Value: !GetAtt RailsPodRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-RailsPodRoleArn
  ArgoCDBridgeRoleArn:
    Value: !GetAtt ArgoCDBridgeRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ArgoCDBridgeRoleArn
