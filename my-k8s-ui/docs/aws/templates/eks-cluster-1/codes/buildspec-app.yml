version: 0.2
# =============================================================================
# buildspec-app.yml  v5
# GitHub commit → Docker build x3 (my-mng / my-gui / my-app) → ECR push →
# Helm package x3 → GitHub helm-charts repo push → ArgoCD auto-sync
#
# Helm chart構成:
#   my-mng : オーケストレータ常駐サービス (system MNG)
#   my-gui : ユーザ毎テナント分離 (Karpenter workload)
#   my-app : サービス毎テナント分離 (Karpenter workload, 計算量変動)
# =============================================================================

env:
  secrets-manager:
    GITHUB_TOKEN: "${GITHUB_SECRET_ARN}:github_token"
    GITHUB_USER:  "${GITHUB_SECRET_ARN}:github_user"

phases:
  install:
    runtime-versions:
      docker: 20
    commands:
      - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - curl -sSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

  pre_build:
    commands:
      - COMMIT_SHA=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - IMAGE_TAG="sha-${COMMIT_SHA}"
      - TIMESTAMP=$(date +%Y%m%d%H%M%S)
      - CHART_VERSION="0.1.${TIMESTAMP}"
      - echo "tag=${IMAGE_TAG}  chart=${CHART_VERSION}"
      - aws ecr get-login-password --region ${AWS_REGION} |
          docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
      - git clone https://${GITHUB_USER}:${GITHUB_TOKEN}@github.com/${HELM_REPO_OWNER}/${HELM_REPO_NAME}.git /tmp/helm-repo
      - cd /tmp/helm-repo && git config user.email "codebuild@ci" && git config user.name "CodeBuild"

  build:
    commands:
      # ── my-mng (オーケストレータ + WebUI, system MNG常駐) ──
      - echo "=== Build my-mng ==="
      - docker build
          --cache-from ${ECR_MNG_URI}:latest
          --build-arg BUILDKIT_INLINE_CACHE=1 --build-arg RAILS_ENV=production
          -t ${ECR_MNG_URI}:${IMAGE_TAG} -t ${ECR_MNG_URI}:latest
          -f apps/my-mng/Dockerfile apps/my-mng/
      - docker push ${ECR_MNG_URI}:${IMAGE_TAG} && docker push ${ECR_MNG_URI}:latest

      # ── my-gui (ユーザ毎テナント, Karpenter) ──
      - echo "=== Build my-gui ==="
      - docker build
          --cache-from ${ECR_GUI_URI}:latest
          --build-arg BUILDKIT_INLINE_CACHE=1 --build-arg RAILS_ENV=production
          -t ${ECR_GUI_URI}:${IMAGE_TAG} -t ${ECR_GUI_URI}:latest
          -f apps/my-gui/Dockerfile apps/my-gui/
      - docker push ${ECR_GUI_URI}:${IMAGE_TAG} && docker push ${ECR_GUI_URI}:latest

      # ── my-app (サービス毎テナント, Karpenter, 計算量変動) ──
      - echo "=== Build my-app ==="
      - docker build
          --cache-from ${ECR_APP_URI}:latest
          --build-arg BUILDKIT_INLINE_CACHE=1 --build-arg RAILS_ENV=production
          -t ${ECR_APP_URI}:${IMAGE_TAG} -t ${ECR_APP_URI}:latest
          -f apps/my-app/Dockerfile apps/my-app/
      - docker push ${ECR_APP_URI}:${IMAGE_TAG} && docker push ${ECR_APP_URI}:latest

      # ── Helm package: my-mng ──
      - echo "=== Helm package my-mng ==="
      - cd helm/my-mng
      - yq e ".version = \"${CHART_VERSION}\"" -i Chart.yaml
      - yq e ".appVersion = \"${IMAGE_TAG}\""  -i Chart.yaml
      - yq e ".image.tag = \"${IMAGE_TAG}\""   -i values.yaml
      - yq e ".image.repository = \"${ECR_MNG_URI}\"" -i values.yaml
      - helm lint . && helm package . -d /tmp/helm-repo/charts/
      - cd ../..

      # ── Helm package: my-gui ──
      - echo "=== Helm package my-gui ==="
      - cd helm/my-gui
      - yq e ".version = \"${CHART_VERSION}\"" -i Chart.yaml
      - yq e ".appVersion = \"${IMAGE_TAG}\""  -i Chart.yaml
      - yq e ".image.tag = \"${IMAGE_TAG}\""   -i values.yaml
      - yq e ".image.repository = \"${ECR_GUI_URI}\"" -i values.yaml
      - helm lint . && helm package . -d /tmp/helm-repo/charts/
      - cd ../..

      # ── Helm package: my-app ──
      - echo "=== Helm package my-app ==="
      - cd helm/my-app
      - yq e ".version = \"${CHART_VERSION}\"" -i Chart.yaml
      - yq e ".appVersion = \"${IMAGE_TAG}\""  -i Chart.yaml
      - yq e ".image.tag = \"${IMAGE_TAG}\""   -i values.yaml
      - yq e ".image.repository = \"${ECR_APP_URI}\"" -i values.yaml
      - helm lint . && helm package . -d /tmp/helm-repo/charts/
      - cd ../..

      - helm repo index /tmp/helm-repo/charts/ --url https://${HELM_REPO_OWNER}.github.io/${HELM_REPO_NAME}/charts

  post_build:
    commands:
      - cd /tmp/helm-repo
      - git add charts/
      - git commit -m "ci: charts sha-${COMMIT_SHA} [skip ci]"
      - git push origin main
      # ArgoCD はmy-mngのApplication定義を自動検出してupgrade sync
      # my-gui/my-appはApplicationSetが各テナントnamespaceへupgrade適用
      - echo "Done. tag=${IMAGE_TAG} chart=${CHART_VERSION}"

cache:
  paths:
    - '/root/.bundle/**/*'
    - '/root/.cache/**/*'
