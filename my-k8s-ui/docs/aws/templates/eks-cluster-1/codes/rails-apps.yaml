# =============================================================================
# argocd/rails-apps.yaml  v5
#
# アプリ構成:
#   my-mng  : オーケストレータ常駐サービス (system MNG)
#             → ArgoCD Application で管理 (初期install + upgrade自動)
#             → jobでmy-gui/my-appのinstall/uninstallをArgoCD API経由で制御
#
#   my-gui  : ユーザ毎テナント分離 (Karpenter workload nodes)
#             → ArgoCD ApplicationSet で管理
#             → ランダム文字列namespace (gui-<uuid>)
#             → my-mng Job → ArgoCD API create/delete → 完了ポーリング
#
#   my-app  : サービス毎テナント分離 (Karpenter workload nodes)
#             → ArgoCD ApplicationSet で管理
#             → ランダム文字列namespace (app-<uuid>)
#             → 計算量に応じてPod数変動 (HPA管理)
#
# 外部接続フロー:
#   Browser → Route53 → IGW → ALB(WAF) → NGINX-Ingress(URLパス書換)
#     → envoy(URL書換) → my-gui → my-app
# =============================================================================

# ── AppProject: テナントワークロード (my-gui / my-app) ────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenant-workloads
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Tenant-isolated workloads (my-gui per-user, my-app per-service)
  sourceRepos:
    - '*'
  destinations:
    # ランダム文字列namespaceに対応 (my-mng Jobが作成)
    - namespace: 'gui-*'
      server: https://kubernetes.default.svc
    - namespace: 'app-*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: cert-manager.io
      kind: Certificate
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    # my-mng サーバがArgoCD APIでinstall/uninstallを制御
    - name: mng-deployer
      description: my-mng server controls tenant install/uninstall via ArgoCD API
      policies:
        - p, proj:tenant-workloads:mng-deployer, applications, get,    tenant-workloads/*, allow
        - p, proj:tenant-workloads:mng-deployer, applications, sync,   tenant-workloads/*, allow
        - p, proj:tenant-workloads:mng-deployer, applications, delete, tenant-workloads/*, allow
        - p, proj:tenant-workloads:mng-deployer, applications, create, tenant-workloads/*, allow
        - p, proj:tenant-workloads:mng-deployer, applications, update, tenant-workloads/*, allow
        - p, proj:tenant-workloads:mng-deployer, applicationsets, get, tenant-workloads/*, allow
      jwtTokens:
        - iat: 0   # deploy.shで実トークンに置き換え

# ── AppProject: platform管理 (my-mng) ────────────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform applications (my-mng orchestrator, cert-manager, ESO etc.)
  sourceRepos:
    - '*'
  destinations:
    - namespace: 'my-mng'
      server: https://kubernetes.default.svc
    - namespace: 'cert-manager'
      server: https://kubernetes.default.svc
    - namespace: 'external-secrets'
      server: https://kubernetes.default.svc
    - namespace: 'ingress-nginx'
      server: https://kubernetes.default.svc
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

# ── ArgoCD Application: my-mng (常駐サービス, system MNG) ─────────────────────
# ArgoCDにより初期インストール & Helm chartアップデート時に自動upgrade
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-mng
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # upgrade はArgoCD自動、initial install もArgoCD (deploy.shがトリガー)
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    repoURL: HELM_REPO_URL_PLACEHOLDER
    chart: my-mng
    targetRevision: "*"   # 最新バージョンに自動追従
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: my-mng
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas   # HPA管理

# ── ArgoCD ApplicationSet: my-gui (ユーザ毎テナント) ──────────────────────────
# my-mng Jobがランダムnamespace(gui-<uuid>)を作成し、
# ArgoCD APIでApplicationを個別作成→完了ポーリング
# CodeBuildがHelmチャートを更新すると全テナントへ自動upgrade
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: my-gui-tenants
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  # my-mng Jobがこのgeneratorが参照するConfigMapエントリを追加/削除する
  # Install: my-mng Job → ConfigMap書込み → ApplicationSet検知 → Application生成 → sync待機
  # Uninstall: my-mng Job → ConfigMap削除 → ApplicationSet検知 → Application削除 → 完了確認
  generators:
    - list:
        elements: []   # my-mng Jobが動的に追加 (例: {namespace: gui-abc123, userId: u-001})
  template:
    metadata:
      name: "my-gui-{{namespace}}"
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: applicationset
        app.kubernetes.io/component: my-gui
        tenant-namespace: "{{namespace}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: tenant-workloads
      source:
        repoURL: HELM_REPO_URL_PLACEHOLDER
        chart: my-gui
        targetRevision: "*"
        helm:
          parameters:
            - name: namespace
              value: "{{namespace}}"
            - name: tenant.userId
              value: "{{userId}}"
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false   # my-mng Jobが事前作成
          - RespectIgnoreDifferences=true
        retry:
          limit: 3
          backoff: {duration: 10s, factor: 2, maxDuration: 2m}
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

# ── ArgoCD ApplicationSet: my-app (サービス毎テナント) ────────────────────────
# my-appはサービス毎に分離。計算量変動に対しHPAがPod数を制御。
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: my-app-tenants
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  generators:
    - list:
        elements: []   # my-mng Jobが動的に追加 (例: {namespace: app-xyz789, serviceId: s-001, userId: u-001})
  template:
    metadata:
      name: "my-app-{{namespace}}"
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: applicationset
        app.kubernetes.io/component: my-app
        tenant-namespace: "{{namespace}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: tenant-workloads
      source:
        repoURL: HELM_REPO_URL_PLACEHOLDER
        chart: my-app
        targetRevision: "*"
        helm:
          parameters:
            - name: namespace
              value: "{{namespace}}"
            - name: tenant.serviceId
              value: "{{serviceId}}"
            - name: tenant.userId
              value: "{{userId}}"
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - RespectIgnoreDifferences=true
        retry:
          limit: 3
          backoff: {duration: 10s, factor: 2, maxDuration: 2m}
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas   # HPAがmy-appのPod数を管理

# ── Helm Chart Repository ─────────────────────────────────────────────────────
---
apiVersion: v1
kind: Secret
metadata:
  name: app-helm-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: helm
  name: app-charts
  url: HELM_REPO_URL_PLACEHOLDER
