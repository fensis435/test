{{/* ==========================================================================
  rails-app/templates/misc.yaml
  rails-gui と同構成。プロジェクト単位namespace(app-{id})に deploy される。
  ========================================================================== */}}

# ── EFS PVC ───────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rails-app.fullname" . }}-efs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rails-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: {{ .Values.persistence.size }}

# ── cert-manager Certificate ──────────────────────────────────────────────────
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "rails-app.fullname" . }}-ssh-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rails-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: {{ include "rails-app.fullname" . }}-ssh-cert
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
  commonName: {{ include "rails-app.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  dnsNames:
    - {{ include "rails-app.fullname" . }}
    - {{ include "rails-app.fullname" . }}.{{ .Release.Namespace }}
    - {{ include "rails-app.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

# ── ServiceAccount ────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rails-app.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rails-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: true

# ── Leader Election RBAC ──────────────────────────────────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rails-app.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["rails-app-leader"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rails-app.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rails-app.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "rails-app.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

# ── ArgoCD Application ────────────────────────────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "rails-app.fullname" . }}
  namespace: argocd
  labels:
    {{- include "rails-app.labels" . | nindent 4 }}
    app.kubernetes.io/managed-by-rails: "app"
    app.kubernetes.io/project-id: {{ .Values.project.id | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: rails-workloads
  source:
    repoURL: {{ .Values.argocd.helmRepoUrl }}
    chart: rails-app
    targetRevision: {{ .Values.argocd.chartVersion | default "*" }}
    helm:
      parameters:
        - name: image.tag
          value: {{ .Values.image.tag | quote }}
        - name: project.id
          value: {{ .Values.project.id | quote }}
        - name: project.name
          value: {{ .Values.project.name | quote }}
        - name: namespace
          value: {{ .Release.Namespace | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

# ── ArgoCD 同期待機スクリプト (rails-guiと同一内容) ─────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rails-app.fullname" . }}-argocd-scripts
  namespace: {{ .Release.Namespace }}
data:
  wait-for-sync.sh: |
    #!/bin/bash
    # ==========================================================================
    # ArgoCD sync/delete 完了待機スクリプト
    # 呼び出し元: Rails Job (pre/post処理フロー内の helm install/uninstall ステップ)
    #
    # [install フロー]
    #   Rails Job pre処理
    #     → (このスクリプト) ArgoCD API POST /sync → Synced+Healthy まで周期ポーリング
    #   → Rails Job post処理
    #
    # [uninstall フロー]
    #   Rails Job pre処理
    #     → (このスクリプト) ArgoCD API DELETE app → 404 まで周期ポーリング
    #   → Rails Job post処理
    # ==========================================================================
    set -euo pipefail

    ARGOCD_SERVER="${ARGOCD_SERVER:-argocd-server.argocd.svc.cluster.local:443}"
    ARGOCD_APP="${ARGOCD_APP_NAME:?ARGOCD_APP_NAME is required}"
    ACTION="${ACTION:-install}"
    POLL_INTERVAL="${POLL_INTERVAL:-5}"
    TIMEOUT="${TIMEOUT:-300}"

    # ArgoCDトークン取得 (Pod IdentityでSM呼び出し可能)
    TOKEN=$(aws secretsmanager get-secret-value \
      --secret-id "${ARGOCD_TOKEN_SECRET_ARN:?}" \
      --query SecretString --output text | jq -r '.token')

    argocd_get() {
      curl -sk -o /dev/null -w "%{http_code}\n%{stdout}" \
        -H "Authorization: Bearer ${TOKEN}" \
        "https://${ARGOCD_SERVER}/api/v1/$1"
    }

    argocd_get_json() {
      curl -sk -H "Authorization: Bearer ${TOKEN}" \
        "https://${ARGOCD_SERVER}/api/v1/$1"
    }

    argocd_post() {
      curl -sk -X POST \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${2:-{\}}" \
        "https://${ARGOCD_SERVER}/api/v1/$1"
    }

    argocd_delete() {
      curl -sk -X DELETE \
        -H "Authorization: Bearer ${TOKEN}" \
        "https://${ARGOCD_SERVER}/api/v1/applications/${ARGOCD_APP}?cascade=true&propagationPolicy=foreground"
    }

    elapsed=0

    # ── install: sync トリガー → Synced+Healthy 待機 ─────────────────────────
    if [[ "${ACTION}" == "install" ]]; then
      echo "[$(date +%T)] ArgoCD sync trigger: ${ARGOCD_APP}"

      argocd_post "applications/${ARGOCD_APP}/sync" \
        '{"prune":true,"dryRun":false,"strategy":{"hook":{"force":true}}}' \
        > /dev/null

      while [[ $elapsed -lt $TIMEOUT ]]; do
        resp=$(argocd_get_json "applications/${ARGOCD_APP}" 2>/dev/null || echo "{}")

        sync_status=$(  echo "$resp" | jq -r '.status.sync.status          // "Unknown"')
        health_status=$(echo "$resp" | jq -r '.status.health.status        // "Unknown"')
        op_phase=$(     echo "$resp" | jq -r '.status.operationState.phase // "Unknown"')

        echo "[$(date +%T)] +${elapsed}s sync=${sync_status} health=${health_status} op=${op_phase}"

        # 成功
        if [[ "${sync_status}" == "Synced" && "${health_status}" == "Healthy" ]]; then
          echo "[$(date +%T)] ✓ ${ARGOCD_APP} Synced and Healthy"
          exit 0
        fi

        # 失敗
        if [[ "${op_phase}" == "Failed" || "${op_phase}" == "Error" ]]; then
          msg=$(echo "$resp" | jq -r '.status.operationState.message // "no detail"')
          echo "[$(date +%T)] ✗ Sync failed: ${msg}"
          exit 1
        fi

        sleep "${POLL_INTERVAL}"
        elapsed=$((elapsed + POLL_INTERVAL))
      done

      echo "[$(date +%T)] ✗ Timeout (${TIMEOUT}s) waiting for sync"
      exit 1

    # ── uninstall: delete → 404 待機 ─────────────────────────────────────────
    elif [[ "${ACTION}" == "uninstall" ]]; then
      echo "[$(date +%T)] ArgoCD delete (cascade): ${ARGOCD_APP}"

      argocd_delete > /dev/null 2>&1 || true

      while [[ $elapsed -lt $TIMEOUT ]]; do
        http_code=$(curl -sk -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer ${TOKEN}" \
          "https://${ARGOCD_SERVER}/api/v1/applications/${ARGOCD_APP}")

        echo "[$(date +%T)] +${elapsed}s HTTP=${http_code}"

        if [[ "${http_code}" == "404" ]]; then
          echo "[$(date +%T)] ✓ ${ARGOCD_APP} deleted"
          exit 0
        fi

        sleep "${POLL_INTERVAL}"
        elapsed=$((elapsed + POLL_INTERVAL))
      done

      echo "[$(date +%T)] ✗ Timeout (${TIMEOUT}s) waiting for delete"
      exit 1

    else
      echo "Unknown ACTION: ${ACTION} (use install or uninstall)"
      exit 1
    fi

# ── Service ───────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rails-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rails-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rails-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: ssh
      port: 2222
      targetPort: 2222

# ── HPA ───────────────────────────────────────────────────────────────────────
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rails-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rails-app.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max

# ── PDB ───────────────────────────────────────────────────────────────────────
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rails-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "rails-app.selectorLabels" . | nindent 6 }}

# ── NetworkPolicy ─────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rails-app.fullname" . }}-netpol
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "rails-app.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aws-load-balancer
      ports:
        - port: 3000
    - from:
        - podSelector: {}
      ports:
        - port: 2222
        - port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/managed-by-rails: "gui"
      ports:
        - port: 2222
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 2049
    - ports:
        - protocol: TCP
          port: 2222

# ── ExternalSecret (DB credentials) ──────────────────────────────────────────
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DB_HOST:     "{{ `{{ .host }}` }}"
        DB_PORT:     "{{ `{{ .port }}` }}"
        DB_NAME:     "{{ `{{ .dbname }}` }}"
        DB_USERNAME: "{{ `{{ .username }}` }}"
        DB_PASSWORD: "{{ `{{ .password }}` }}"
        DATABASE_URL: "postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ `{{ .host }}` }}:{{ `{{ .port }}` }}/{{ `{{ .dbname }}` }}?sslmode=require"
  data:
    - secretKey: host
      remoteRef:
        key: "{{ .Values.secretsManager.rdsSecretName }}"
        property: host
    - secretKey: port
      remoteRef:
        key: "{{ .Values.secretsManager.rdsSecretName }}"
        property: port
    - secretKey: dbname
      remoteRef:
        key: "{{ .Values.secretsManager.rdsSecretName }}"
        property: dbname
    - secretKey: username
      remoteRef:
        key: "{{ .Values.secretsManager.rdsSecretName }}"
        property: username
    - secretKey: password
      remoteRef:
        key: "{{ .Values.secretsManager.rdsSecretName }}"
        property: password
