# =============================================================================
# argocd/rails-apps.yaml
# ArgoCD Applications for Rails workload management.
#
# Architecture:
#   GitHub Helm repo updated by CodeBuild
#     └─► ArgoCD detects change → auto-sync → helm upgrade
#
#   Rails Job (install/uninstall):
#     pre処理 → ArgoCD API (sync/delete) → post処理
#     ※ upgrade は ArgoCD 自動、install/uninstall は Rails Job から呼び出し
# =============================================================================

# ── ArgoCD AppProject for Rails workloads ─────────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: rails-workloads
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Rails GUI and App workloads (per-user and per-project namespaces)
  sourceRepos:
    - '*'   # Allow Helm charts from any repo (GitHub Pages helm repo)
  destinations:
    # GUI namespaces pattern: gui-*
    - namespace: 'gui-*'
      server: https://kubernetes.default.svc
    # App namespaces pattern: app-*
    - namespace: 'app-*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: cert-manager.io
      kind: Certificate
    - group: cert-manager.io
      kind: ClusterIssuer
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    # Rails server can sync/delete apps via API token
    - name: rails-deployer
      description: Rails server ArgoCD API access for install/uninstall
      policies:
        - p, proj:rails-workloads:rails-deployer, applications, get,    rails-workloads/*, allow
        - p, proj:rails-workloads:rails-deployer, applications, sync,   rails-workloads/*, allow
        - p, proj:rails-workloads:rails-deployer, applications, delete, rails-workloads/*, allow
        - p, proj:rails-workloads:rails-deployer, applications, create, rails-workloads/*, allow
        - p, proj:rails-workloads:rails-deployer, applications, update, rails-workloads/*, allow
      jwtTokens:
        # Token generated by deploy.sh and stored in Secrets Manager
        - iat: 0   # placeholder; real token added by deploy.sh

# ── Helm Chart Repository (GitHub Pages) ─────────────────────────────────────
---
apiVersion: v1
kind: Secret
metadata:
  name: rails-helm-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: helm
  name: rails-charts
  url: HELM_REPO_URL_PLACEHOLDER   # e.g. https://myorg.github.io/helm-charts
  # No auth needed for public GitHub Pages
