AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EKS Cluster(2AZ) + Managed Node Groups + EFS + RDS Aurora PostgreSQL.
  Node groups:
    system-mng : Fixed 2 nodes (1 per AZ). Runs management pods only.
                 Taint: role=system:NoSchedule. スケールしない。
    (Karpenter provisions all workload nodes dynamically via NodePool)

Parameters:
  ProjectName:
    Type: String
    Default: eks-project
  Environment:
    Type: String
    Default: prod
  KubernetesVersion:
    Type: String
    Default: '1.31'
  DBInstanceClass:
    Type: String
    Default: db.r8g.large
  DBName:
    Type: String
    Default: appdb
  DBUsername:
    Type: String
    Default: appuser

Resources:

  # ============================================================
  # EKS Cluster
  # ============================================================
  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub ${ProjectName}-${Environment}
      Version: !Ref KubernetesVersion
      RoleArn: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-EKSClusterRoleArn
      ResourcesVpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet1Id
          - !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet2Id
          - !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-PublicSubnet1Id
          - !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-PublicSubnet2Id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-EKSClusterSecurityGroupId
        EndpointPublicAccess: false
        EndpointPrivateAccess: true
      KubernetesNetworkConfig:
        ServiceCidr: 172.20.0.0/16
        IpFamily: ipv4
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
            - Type: controllerManager
            - Type: scheduler
      EncryptionConfig:
        - Provider:
            KeyArn: !ImportValue
              Fn::Sub: ${ProjectName}-${Environment}-EKSSecretsKMSKeyArn
          Resources: [secrets]
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}
        - Key: karpenter.sh/discovery
          Value: !Sub ${ProjectName}-${Environment}

  # ============================================================
  # EKS Add-ons
  # ============================================================
  VPCCNIAddon:
    Type: AWS::EKS::Addon
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE
      ConfigurationValues: '{"env":{"ENABLE_PREFIX_DELEGATION":"true","WARM_PREFIX_TARGET":"1"}}'

  CoreDNSAddon:
    Type: AWS::EKS::Addon
    DependsOn: SystemManagedNodeGroup
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: coredns
      ResolveConflicts: OVERWRITE

  KubeProxyAddon:
    Type: AWS::EKS::Addon
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: kube-proxy
      ResolveConflicts: OVERWRITE

  PodIdentityAddon:
    Type: AWS::EKS::Addon
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE

  EBSCSIAddon:
    Type: AWS::EKS::Addon
    DependsOn: PodIdentityAddon
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: aws-ebs-csi-driver
      ResolveConflicts: OVERWRITE
      PodIdentityAssociations:
        - RoleArn: !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-EBSCSIDriverRoleArn
          ServiceAccount: ebs-csi-controller-sa
          Namespace: kube-system

  EFSCSIAddon:
    Type: AWS::EKS::Addon
    DependsOn: PodIdentityAddon
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: aws-efs-csi-driver
      ResolveConflicts: OVERWRITE
      PodIdentityAssociations:
        - RoleArn: !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-EFSCSIDriverRoleArn
          ServiceAccount: efs-csi-controller-sa
          Namespace: kube-system

  # ============================================================
  # System Managed Node Group
  # Purpose  : 管理系Pod専用 (Karpenter, ArgoCD, ESO, ALB-ctrl,
  #            cert-manager, CW Agent 等)
  # Replicas : 初期1台。性能不足時のみ2台へ拡張 (手動 MaxSize: 2)
  #             Karpenter workerとは独立 — Karpenterが起動するEC2と共用しない
  # Taint    : CriticalAddonsOnly=true:NoSchedule
  #            → 管理系Pod (Karpenter,ArgoCD,ESO,ALB-ctrl等) だけToleration持つ
  #            → Railsワークロードは来ない → Karpenter NodePoolへ流れる
  # ============================================================
  SystemManagedNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn:
      - VPCCNIAddon
      - KubeProxyAddon
      - PodIdentityAddon
    Properties:
      ClusterName: !Ref EKSCluster
      NodegroupName: !Sub ${ProjectName}-${Environment}-system
      NodeRole: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-EKSNodeRoleArn
      Subnets:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet1Id
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet2Id
      # m6i.large: 2vCPU 8GiB — 管理podには十分
      InstanceTypes:
        - m6i.large
      ScalingConfig:
        MinSize: 1
        MaxSize: 2      # 通常1台、性能不足時は2台に変更可
        DesiredSize: 1
      AmiType: AL2023_x86_64_STANDARD
      DiskSize: 50
      Labels:
        role: system
        node-type: managed
        karpenter.sh/do-not-disrupt: "true"
      Taints:
        # 標準taint名: 管理系pod(Karpenter/ArgoCD/ESO等)だけToleration持つ
        - Key: CriticalAddonsOnly
          Value: "true"
          Effect: NO_SCHEDULE
      UpdateConfig:
        MaxUnavailable: 1   # 1台ずつローリングアップデート
      Tags:
        Name: !Sub ${ProjectName}-${Environment}-system-node

  # ============================================================
  # EFS File System (Multi-AZ — Rails PV用, EBSは使わない)
  # ============================================================
  EFSFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      KmsKeyId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-EFSKMSKeyArn
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      FileSystemPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - elasticfilesystem:ClientMount
              - elasticfilesystem:ClientWrite
              - elasticfilesystem:ClientRootAccess
            Condition:
              Bool:
                aws:SecureTransport: 'true'
          - Effect: Deny
            Principal:
              AWS: '*'
            Action: '*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
      BackupPolicy:
        Status: ENABLED
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
        - TransitionToPrimaryStorageClass: AFTER_1_ACCESS
      FileSystemTags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-efs

  # Mount targets — 2AZのみ
  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet1Id
      SecurityGroups:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-EFSSecurityGroupId

  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet2Id
      SecurityGroups:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-EFSSecurityGroupId

  # EFS Access Points (gui / app / shared)
  # my-mng: オーケストレータ兼WebUI (system MNG上で常駐)
  EFSMngAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EFSFileSystem
      PosixUser:
        Uid: '1000'
        Gid: '1000'
      RootDirectory:
        CreationInfo:
          OwnerUid: '1000'
          OwnerGid: '1000'
          Permissions: '755'
        Path: /mng-data
      AccessPointTags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-efs-mng-ap

  # my-gui: ユーザ毎テナント分離 (Karpenter workload nodes)
  EFSGUIAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EFSFileSystem
      PosixUser:
        Uid: '1000'
        Gid: '1000'
      RootDirectory:
        CreationInfo:
          OwnerUid: '1000'
          OwnerGid: '1000'
          Permissions: '755'
        Path: /gui-data
      AccessPointTags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-efs-gui-ap

  # my-app: サービス毎テナント分離 (Karpenter workload nodes)
  EFSAppAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EFSFileSystem
      PosixUser:
        Uid: '1000'
        Gid: '1000'
      RootDirectory:
        CreationInfo:
          OwnerUid: '1000'
          OwnerGid: '1000'
          Permissions: '755'
        Path: /app-data
      AccessPointTags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-efs-app-ap

  # shared: rsync staging
  EFSSharedAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EFSFileSystem
      PosixUser:
        Uid: '1000'
        Gid: '1000'
      RootDirectory:
        CreationInfo:
          OwnerUid: '1000'
          OwnerGid: '1000'
          Permissions: '755'
        Path: /shared
      AccessPointTags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-efs-shared-ap

  # ============================================================
  # RDS Aurora PostgreSQL
  # ============================================================
  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub ${ProjectName}-${Environment}-db-subnet-group
      DBSubnetGroupDescription: 2AZ subnet group for RDS Aurora
      SubnetIds:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-DBSubnet1Id
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-DBSubnet2Id

  RDSClusterParameterGroup:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      DBClusterParameterGroupName: !Sub ${ProjectName}-${Environment}-aurora-pg-params
      Description: Aurora PostgreSQL 16 cluster params
      Family: aurora-postgresql16
      Parameters:
        log_connections: '1'
        log_disconnections: '1'
        shared_preload_libraries: 'pg_stat_statements'
        rds.force_ssl: '1'

  RDSParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      DBParameterGroupName: !Sub ${ProjectName}-${Environment}-pg-params
      Description: PostgreSQL 16 instance params
      Family: aurora-postgresql16
      Parameters:
        log_min_duration_statement: '1000'
        log_statement: 'ddl'
        max_connections: '200'
        work_mem: '16384'

  RDSMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${ProjectName}/${Environment}/rds/master-credentials
      Description: RDS Aurora PostgreSQL master credentials
      KmsKeyId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-SecretsManagerKMSKeyArn
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}","dbname":"${DBName}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  RDSCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub ${ProjectName}-${Environment}-postgres
      Engine: aurora-postgresql
      EngineVersion: '16.4'
      DatabaseName: !Ref DBName
      MasterUsername: !Sub
        - '{{resolve:secretsmanager:${SecretArn}:SecretString:username}}'
        - SecretArn: !Ref RDSMasterSecret
      MasterUserPassword: !Sub
        - '{{resolve:secretsmanager:${SecretArn}:SecretString:password}}'
        - SecretArn: !Ref RDSMasterSecret
      DBSubnetGroupName: !Ref RDSSubnetGroup
      VpcSecurityGroupIds:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-RDSSecurityGroupId
      KmsKeyId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-RDSKMSKeyArn
      StorageEncrypted: true
      EnableIAMDatabaseAuthentication: true
      BackupRetentionPeriod: 14
      PreferredBackupWindow: 17:00-18:00
      PreferredMaintenanceWindow: Mon:18:00-Mon:19:00
      DeletionProtection: true
      EnableCloudwatchLogsExports: [postgresql]
      DBClusterParameterGroupName: !Ref RDSClusterParameterGroup

  RDSWriterInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-${Environment}-postgres-writer
      DBClusterIdentifier: !Ref RDSCluster
      DBInstanceClass: !Ref DBInstanceClass
      Engine: aurora-postgresql
      PubliclyAccessible: false
      DBParameterGroupName: !Ref RDSParameterGroup
      MonitoringInterval: 60
      MonitoringRoleArn: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-RDSMonitoringRoleArn
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-RDSKMSKeyArn
      PerformanceInsightsRetentionPeriod: 31
      AutoMinorVersionUpgrade: true

  RDSReaderInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-${Environment}-postgres-reader
      DBClusterIdentifier: !Ref RDSCluster
      DBInstanceClass: !Ref DBInstanceClass
      Engine: aurora-postgresql
      PubliclyAccessible: false
      DBParameterGroupName: !Ref RDSParameterGroup
      MonitoringInterval: 60
      MonitoringRoleArn: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-RDSMonitoringRoleArn
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-RDSKMSKeyArn
      PerformanceInsightsRetentionPeriod: 31
      AutoMinorVersionUpgrade: true

  RDSSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref RDSMasterSecret
      TargetId: !Ref RDSCluster
      TargetType: AWS::RDS::DBCluster

  RDSSecretRotation:
    Type: AWS::SecretsManager::RotationSchedule
    Properties:
      SecretId: !Ref RDSMasterSecret
      HostedRotationLambda:
        RotationType: PostgreSQLSingleUser
        RotationLambdaName: !Sub ${ProjectName}-${Environment}-rds-rotation
        VpcSecurityGroupIds: !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-RDSSecurityGroupId
        VpcSubnetIds: !Join
          - ','
          - - !ImportValue
              Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet1Id
            - !ImportValue
              Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet2Id
      RotationRules:
        AutomaticallyAfterDays: 30

Outputs:
  EKSClusterName:
    Value: !Ref EKSCluster
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EKSClusterName
  EKSClusterArn:
    Value: !GetAtt EKSCluster.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EKSClusterArn
  EKSClusterEndpoint:
    Value: !GetAtt EKSCluster.Endpoint
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EKSClusterEndpoint
  SystemManagedNodeGroupName:
    Value: !Ref SystemManagedNodeGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-SystemManagedNodeGroupName
  EFSFileSystemId:
    Value: !Ref EFSFileSystem
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EFSFileSystemId
  EFSMngAccessPointId:
    Value: !Ref EFSMngAccessPoint
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EFSMngAccessPointId

  EFSGUIAccessPointId:
    Value: !Ref EFSGUIAccessPoint
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EFSGUIAccessPointId
  EFSAppAccessPointId:
    Value: !Ref EFSAppAccessPoint
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EFSAppAccessPointId
  EFSSharedAccessPointId:
    Value: !Ref EFSSharedAccessPoint
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EFSSharedAccessPointId
  RDSClusterEndpoint:
    Value: !GetAtt RDSCluster.Endpoint.Address
    Export:
      Name: !Sub ${ProjectName}-${Environment}-RDSClusterEndpoint
  RDSClusterReaderEndpoint:
    Value: !GetAtt RDSCluster.ReadEndpoint.Address
    Export:
      Name: !Sub ${ProjectName}-${Environment}-RDSClusterReaderEndpoint
  RDSMasterSecretArn:
    Value: !Ref RDSMasterSecret
    Export:
      Name: !Sub ${ProjectName}-${Environment}-RDSMasterSecretArn
