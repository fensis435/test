# =============================================================================
# argocd/platform-apps.yaml
# Platform管理系ArgoCD Application群。
# 全コンポーネントにToleration: CriticalAddonsOnly=true:NoSchedule を設定
# → system managed node group上だけで動作する。Karpenter workerには来ない。
# =============================================================================

# ── cert-manager ──────────────────────────────────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.16.2
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        webhook:
          replicaCount: 1
        cainjector:
          replicaCount: 1
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
        webhook:
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        cainjector:
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        nodeSelector:
          role: system
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# ── cluster-issuers (cert-manager CRD依存) ───────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-issuers
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ARGOCD_REPO_URL_PLACEHOLDER
    targetRevision: HEAD
    path: platform/cluster-issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# ── External Secrets Operator ─────────────────────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.4
    helm:
      values: |
        replicaCount: 1
        installCRDs: true
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
        webhook:
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        certController:
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        nodeSelector:
          role: system
        serviceAccount:
          name: external-secrets
          # Pod Identity — アノテーション不要 (deploy.shでassociation作成)
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# ── ClusterSecretStore (ESO → AWS Secrets Manager) ────────────────────────────
# ESO pod のServiceAccountがPod Identityで IAMロール(ESOControllerRole)を引き受け
# → secretsmanager:GetSecretValue をVPCエンドポイント経由で呼ぶ
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ARGOCD_REPO_URL_PLACEHOLDER
    targetRevision: HEAD
    path: platform/secret-stores
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
