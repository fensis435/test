AWSTemplateFormatVersion: "2010-09-09"
Description: "EKS クラスターロール / ノードロール / CodeBuildロール"

Parameters:
  ClusterName:
    Type: String
  AccountId:
    Type: String
  Region:
    Type: String
  HelmBucket:
    Type: String
  CodeArtifactDomain:
    Type: String
  ProjectTag:
    Type: String

Resources:
  # ---------------------------------------------------------------------------
  # EKS Cluster IAM Role
  # ---------------------------------------------------------------------------
  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-eks-cluster-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSVPCResourceController
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-eks-cluster-role"
        - Key: Project
          Value: !Ref ProjectTag

  # ---------------------------------------------------------------------------
  # EKS Node IAM Role (MNG + Karpenter ノード共用)
  # ---------------------------------------------------------------------------
  EksNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-eks-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-eks-node-role"
        - Key: Project
          Value: !Ref ProjectTag

  EksNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ClusterName}-eks-node-profile"
      Roles:
        - !Ref EksNodeRole

  # Node追加ポリシー: CloudWatch, S3(Helm chart読み込み)
  EksNodeAdditionalPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${ClusterName}-node-additional"
      Roles: [!Ref EksNodeRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "CloudWatchLogs"
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
            Resource: !Sub "arn:aws:logs:${Region}:${AccountId}:log-group:/eks/${ClusterName}/*"
          - Sid: "HelmS3Read"
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Sub "arn:aws:s3:::${HelmBucket}"
              - !Sub "arn:aws:s3:::${HelmBucket}/*"
          - Sid: "KMSEbsUse"
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:CreateGrant
            Resource: "*"
            Condition:
              StringLike:
                "kms:ViaService": !Sub "ec2.${Region}.amazonaws.com"

  # ---------------------------------------------------------------------------
  # CodeBuild IAM Role
  # ---------------------------------------------------------------------------
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-codebuild-role"
        - Key: Project
          Value: !Ref ProjectTag

  CodeBuildPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${ClusterName}-codebuild-policy"
      Roles: [!Ref CodeBuildRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "Logs"
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "arn:aws:logs:${Region}:${AccountId}:log-group:/aws/codebuild/${ClusterName}-*"
          - Sid: "ECR"
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:DescribeRepositories
              - ecr:ListImages
            Resource: "*"
          - Sid: "S3HelmAndArtifacts"
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:ListBucket
              - s3:DeleteObject
            Resource:
              - !Sub "arn:aws:s3:::${HelmBucket}"
              - !Sub "arn:aws:s3:::${HelmBucket}/*"
              - !Sub "arn:aws:s3:::${AccountId}-cfn-artifacts-${Region}"
              - !Sub "arn:aws:s3:::${AccountId}-cfn-artifacts-${Region}/*"
          - Sid: "CodeArtifact"
            Effect: Allow
            Action:
              - codeartifact:GetAuthorizationToken
              - codeartifact:GetRepositoryEndpoint
              - codeartifact:ReadFromRepository
              - codeartifact:PublishPackageVersion
              - codeartifact:PutPackageMetadata
            Resource: "*"
          - Sid: "StsForCodeArtifact"
            Effect: Allow
            Action:
              - sts:GetServiceBearerToken
            Resource: "*"
            Condition:
              StringEquals:
                "sts:AWSServiceName": "codeartifact.amazonaws.com"
          - Sid: "SecretsManager"
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Sub "arn:aws:secretsmanager:${Region}:${AccountId}:secret:${ClusterName}/*"
          - Sid: "KMS"
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: "*"
          - Sid: "VPC"
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeDhcpOptions
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeVpcs
              - ec2:CreateNetworkInterfacePermission
            Resource: "*"
          - Sid: "SSMParameterRead"
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub "arn:aws:ssm:${Region}:${AccountId}:parameter/${ClusterName}/*"

Outputs:
  EksClusterRoleArn:
    Value: !GetAtt EksClusterRole.Arn
    Export:
      Name: !Sub "${ClusterName}-EksClusterRoleArn"
  EksNodeRoleArn:
    Value: !GetAtt EksNodeRole.Arn
    Export:
      Name: !Sub "${ClusterName}-EksNodeRoleArn"
  EksNodeRoleName:
    Value: !Ref EksNodeRole
    Export:
      Name: !Sub "${ClusterName}-EksNodeRoleName"
  EksNodeInstanceProfileArn:
    Value: !GetAtt EksNodeInstanceProfile.Arn
    Export:
      Name: !Sub "${ClusterName}-EksNodeInstanceProfileArn"
  CodeBuildRoleArn:
    Value: !GetAtt CodeBuildRole.Arn
    Export:
      Name: !Sub "${ClusterName}-CodeBuildRoleArn"
