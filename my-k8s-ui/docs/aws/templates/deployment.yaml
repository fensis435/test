{{/* ==========================================================================
  rails-gui/templates/deployment.yaml
  Rails GUI server deployed in gui-{user-id} namespace.
  - Multi-AZ (2 replicas) with leader election via Lease (k8s coordination)
  - EFS PVC (ReadWriteMany) — AZ-agnostic, avoids EBS pending issue
  - rsync SSH sidecar with cert-manager issued key pair
  - Cognito SQS consumer via Pod Identity
  ========================================================================== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rails-gui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rails-gui.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rails-gui.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "rails-gui.selectorLabels" . | nindent 8 }}
      annotations:
        # Restart when cert secret changes
        checksum/cert: {{ include (print $.Template.BasePath "/certificate.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "rails-gui.serviceAccountName" . }}
      automountServiceAccountToken: true

      # Leader election — only the leader pod runs scheduled jobs
      # Uses Kubernetes Lease (coordination.k8s.io) — no external dependency
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ['sh', '-c', 'until pg_isready -h $DB_HOST -p 5432; do echo waiting; sleep 2; done']
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_HOST
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 70

      containers:
        # ── Main Rails container ────────────────────────────────────────────
        - name: rails
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: false   # Rails needs tmp/ writes
            capabilities:
              drop: [ALL]

          env:
            - name: RAILS_ENV
              value: production
            - name: RAILS_SERVE_STATIC_FILES
              value: "true"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            # Leader election identity
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEADER_ELECTION_ENABLED
              value: "true"
            - name: LEADER_LEASE_NAME
              value: "rails-gui-leader"
            # Cognito (label-only groups — RBAC in Rails)
            - name: COGNITO_USER_POOL_ID
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: COGNITO_USER_POOL_ID
            - name: COGNITO_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: COGNITO_CLIENT_ID
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: AWS_REGION
            # SQS queue for Cognito user events
            - name: COGNITO_SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: COGNITO_SQS_QUEUE_URL
            # ArgoCD API (for Job-triggered install/uninstall)
            - name: ARGOCD_SERVER
              value: "argocd-server.argocd.svc.cluster.local:443"
            - name: ARGOCD_INSECURE
              value: "true"
            # rsync SSH key paths (cert-manager issued)
            - name: SSH_HOST_KEY_PATH
              value: /etc/ssh-certs/tls.key
            - name: SSH_HOST_CERT_PATH
              value: /etc/ssh-certs/tls.crt

          envFrom:
            - secretRef:
                name: db-credentials
            - secretRef:
                name: cognito-config
            - secretRef:
                name: argocd-api-token
                optional: true

          volumeMounts:
            - name: efs-data
              mountPath: /data
            - name: ssh-certs
              mountPath: /etc/ssh-certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: rails-tmp
              mountPath: /app/tmp

          resources: {{- toYaml .Values.resources | nindent 12 }}

          livenessProbe:
            httpGet: { path: /health/live, port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet: { path: /health/ready, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3

        # ── rsync SSH sidecar ───────────────────────────────────────────────
        # cert-manager issues a Certificate per namespace → no manual key copy
        - name: rsync-sshd
          image: "{{ .Values.sshSidecar.image.repository }}:{{ .Values.sshSidecar.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          command:
            - /usr/sbin/sshd
            - -D
            - -p 2222
            - -e                           # log to stderr
            - -o HostKey=/etc/ssh-certs/tls.key
            - -o AuthorizedKeysFile=/etc/authorized-keys/authorized_keys
            - -o PasswordAuthentication=no
            - -o PubkeyAuthentication=yes
            - -o StrictModes=no
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0    # sshd needs root to bind < 1024 (or CAP_NET_BIND)
            capabilities:
              add: [NET_BIND_SERVICE]
              drop: [ALL]
          volumeMounts:
            - name: efs-data
              mountPath: /data
            - name: ssh-certs
              mountPath: /etc/ssh-certs
              readOnly: true
            - name: authorized-keys
              mountPath: /etc/authorized-keys
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }

      volumes:
        - name: efs-data
          persistentVolumeClaim:
            claimName: {{ include "rails-gui.fullname" . }}-efs
        - name: ssh-certs
          secret:
            secretName: {{ include "rails-gui.fullname" . }}-ssh-cert
            defaultMode: 0600
        - name: authorized-keys
          configMap:
            name: {{ include "rails-gui.fullname" . }}-authorized-keys
            defaultMode: 0600
        - name: tmp
          emptyDir: {}
        - name: rails-tmp
          emptyDir: {}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "rails-gui.selectorLabels" . | nindent 14 }}

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "rails-gui.selectorLabels" . | nindent 18 }}
              topologyKey: topology.kubernetes.io/zone
