apiVersion: apps/v1
kind: Deployment
metadata:
  name: subweb2-deployment
  labels:
    app: subweb2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subweb2
  template:
    metadata:
      labels:
        app: subweb2
    spec:
      containers:
      - name: subweb2
        image: subweb2:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: subweb2-service
  labels:
    app: subweb2
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8000
  selector:
    app: subweb2
