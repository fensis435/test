apiVersion: apps/v1
kind: Deployment
metadata:
  name: subweb-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subweb
  template:
    metadata:
      labels:
        app: subweb
    spec:
      containers:
      - name: subweb
        image: subweb-flask:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: subweb-service
spec:
  selector:
    app: subweb
  ports:
  - port: 80
    targetPort: 80
