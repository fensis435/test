apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-gui-config
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address: { address: 0.0.0.0, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              codec_type: AUTO
              upgrade_configs:
              - upgrade_type: websocket
              route_config:
                name: local_route
                virtual_hosts:
                - name: backend
                  domains: ["*"]
                  routes:
                  # 3) 通常の /subweb2/* も転送
                  - match:
                      safe_regex:
                        regex: "^/subweb2($|/)"
                    route:
                      cluster: subweb2_service
                      idle_timeout: 3600s
                  # 1) WebSocket (Socket.IO) のパスをそのまま転送
                  - match: { prefix: "/subweb/socket.io" }
                    route: 
                      cluster: subweb_service
                      idle_timeout: 3600s
                  # 2) 通常の /subweb/* もそのまま転送
                  - match: { prefix: "/subweb" }
                    route:
                      cluster: subweb_service
                      idle_timeout: 3600s
                  # 3) それ以外は GUI
                  - match: { prefix: "/" }
                    route: { cluster: gui_service }
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: gui_service
        connect_timeout: 0.5s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: gui_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: 127.0.0.1, port_value: 8000 }

      - name: subweb_service
        connect_timeout: 0.5s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: subweb_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: subweb-service.default.svc.cluster.local. 
                    port_value: 80

      - name: subweb2_service
        connect_timeout: 0.5s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        dns_lookup_family: V4_ONLY
        load_assignment:
          cluster_name: subweb2_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: subweb2-service.default.svc.cluster.local.
                    port_value: 80

    admin:
      access_log_path: "/tmp/admin_access.log"
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }

